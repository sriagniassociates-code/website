<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Sri Agni Associates</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C49A3A; --gold-light: #e0b84a;
      --dark: #0a0a0f; --dark2: #111118; --dark3: #16161f;
      --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.08);
      --text: #e8e8f0; --muted: #8888a0; --error: #ff6b6b;
    }
    body { font-family:'Inter',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
    .bg-orbs { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0.18; animation:drift 12s ease-in-out infinite alternate; }
    .orb-1 { width:500px; height:500px; background:var(--gold); top:-200px; left:-150px; animation-delay:0s; }
    .orb-2 { width:350px; height:350px; background:#6030c0; bottom:-100px; right:-100px; animation-delay:-4s; }
    .orb-3 { width:250px; height:250px; background:var(--gold-light); top:50%; left:60%; animation-delay:-8s; }
    @keyframes drift { from{transform:translate(0,0) scale(1);} to{transform:translate(40px,30px) scale(1.08);} }
    .grid-bg { position:fixed; inset:0; z-index:0; background-image:linear-gradient(rgba(196,154,58,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(196,154,58,0.04) 1px,transparent 1px); background-size:60px 60px; }
    .login-wrap { position:relative; z-index:10; width:100%; max-width:440px; padding:1rem; }
    .login-card { background:rgba(16,16,26,0.85); backdrop-filter:blur(24px) saturate(1.4); -webkit-backdrop-filter:blur(24px) saturate(1.4); border:1px solid var(--border); border-radius:20px; padding:2.8rem 2.4rem 2.4rem; box-shadow:0 0 0 1px rgba(196,154,58,0.1),0 32px 80px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.06); animation:slideUp 0.6s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes slideUp { from{opacity:0;transform:translateY(32px);} to{opacity:1;transform:translateY(0);} }
    .login-brand { display:flex; align-items:center; gap:10px; margin-bottom:2rem; }
    .brand-icon { width:42px; height:42px; background:linear-gradient(135deg,var(--gold),#8a6015); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
    .brand-name { font-family:'Cormorant Garamond',serif; font-size:1.1rem; font-weight:600; color:var(--text); line-height:1.2; }
    .brand-name span { color:var(--gold); }
    .brand-sub { font-size:0.7rem; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
    .login-title { font-size:1.65rem; font-weight:700; letter-spacing:-0.03em; margin-bottom:0.4rem; }
    .login-sub { color:var(--muted); font-size:0.88rem; margin-bottom:2rem; }
    .form-group { margin-bottom:1.2rem; }
    .form-group label { display:block; font-size:0.8rem; font-weight:500; color:var(--muted); margin-bottom:0.5rem; letter-spacing:0.04em; text-transform:uppercase; }
    .input-wrap { position:relative; }
    .input-wrap > svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
    .form-group input { width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:10px; padding:0.82rem 1rem 0.82rem 2.8rem; color:var(--text); font-family:'Inter',sans-serif; font-size:0.95rem; outline:none; transition:border-color 0.2s,box-shadow 0.2s,background 0.2s; }
    .form-group input:focus { border-color:var(--gold); background:rgba(196,154,58,0.05); box-shadow:0 0 0 3px rgba(196,154,58,0.12); }
    .form-group input::placeholder { color:rgba(136,136,160,0.6); }
    .eye-btn { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); padding:4px; display:flex; transition:color 0.2s; }
    .eye-btn:hover { color:var(--gold); }
    .error-msg { display:none; align-items:center; gap:6px; background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.3); border-radius:8px; padding:0.7rem 1rem; color:var(--error); font-size:0.85rem; margin-bottom:1rem; }
    .error-msg.visible { display:flex; animation:shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
    .btn-login { width:100%; padding:0.9rem; background:linear-gradient(135deg,var(--gold),#8a6015); color:#0a0a0f; font-weight:700; font-size:0.95rem; letter-spacing:0.04em; border:none; border-radius:10px; cursor:pointer; font-family:'Inter',sans-serif; transition:opacity 0.2s,transform 0.15s,box-shadow 0.2s; box-shadow:0 4px 20px rgba(196,154,58,0.3); position:relative; overflow:hidden; }
    .btn-login:hover { opacity:0.9; transform:translateY(-1px); box-shadow:0 8px 28px rgba(196,154,58,0.4); }
    .btn-login:active { transform:translateY(0); }
    .btn-login:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .btn-loading { display:none; }
    .btn-login.loading .btn-text { display:none; }
    .btn-login.loading .btn-loading { display:inline-flex; align-items:center; gap:8px; }
    .spinner { width:16px; height:16px; border:2px solid rgba(10,10,15,0.3); border-top-color:#0a0a0f; border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg);} }
    .login-footer { text-align:center; margin-top:1.6rem; color:var(--muted); font-size:0.78rem; }
    .login-footer a { color:var(--gold); text-decoration:none; }
    .login-footer a:hover { text-decoration:underline; }
    .cred-hint { margin-top:1.2rem; background:rgba(196,154,58,0.06); border:1px solid rgba(196,154,58,0.15); border-radius:8px; padding:0.7rem 1rem; font-size:0.78rem; color:var(--muted); }
    .cred-hint strong { color:var(--gold); }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="grid-bg"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">🏛️</div>
        <div>
          <div class="brand-name">Sri Agni <span>Associates</span></div>
          <div class="brand-sub">Admin Portal</div>
        </div>
      </div>

      <h1 class="login-title">Welcome Back</h1>
      <p class="login-sub">Sign in to access your admin dashboard</p>

      <div class="error-msg" id="error-msg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-text">Invalid username or password.</span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off">
        <div class="form-group">
          <label for="login-user">Username</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="login-user" placeholder="Enter username" required />
          </div>
        </div>
        <div class="form-group">
          <label for="login-pass">Password</label>
          <div class="input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="login-pass" placeholder="Enter password" required />
            <button type="button" class="eye-btn" id="eye-btn" onclick="togglePass()" aria-label="Toggle password">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="login-btn">
          <span class="btn-text">Sign In to Dashboard</span>
          <span class="btn-loading"><div class="spinner"></div> Authenticating…</span>
        </button>
      </form>

      <div class="cred-hint">🔑 Default credentials — Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>sriagni@2025</strong></div>
      <div class="login-footer"><a href="index.html">← Back to Website</a></div>
    </div>
  </div>

  <script>
    if (sessionStorage.getItem('sriagni_admin') === 'true') window.location.href = 'admin.html';
    const ADMIN_USER = 'admin', ADMIN_PASS = 'sriagni@2025';
    function togglePass() {
      const inp = document.getElementById('login-pass'), icon = document.getElementById('eye-icon');
      if (inp.type === 'password') { inp.type = 'text'; icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'; }
      else { inp.type = 'password'; icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'; }
    }
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;
      const btn = document.getElementById('login-btn'), err = document.getElementById('error-msg');
      err.classList.remove('visible');
      btn.classList.add('loading'); btn.disabled = true;
      setTimeout(() => {
        if (user === ADMIN_USER && pass === ADMIN_PASS) {
          sessionStorage.setItem('sriagni_admin', 'true');
          sessionStorage.setItem('sriagni_admin_user', user);
          sessionStorage.setItem('sriagni_login_time', new Date().toISOString());
          window.location.href = 'admin.html';
        } else {
          btn.classList.remove('loading'); btn.disabled = false;
          document.getElementById('error-text').textContent = user !== ADMIN_USER ? 'Username not found.' : 'Incorrect password.';
          err.classList.remove('visible');
          void err.offsetWidth;
          err.classList.add('visible');
          document.getElementById('login-pass').value = '';
        }
      }, 900);
    }
  </script>
</body>
</html>
